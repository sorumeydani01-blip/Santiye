name: Günlük Yevmiye Hatırlatması
on: { schedule: [ { cron: '*/15 * * * *' } ], workflow_dispatch: {} }
jobs: { send-reminders: { runs-on: ubuntu-latest, steps: [ { name: 'Kodu al', uses: 'actions/checkout@v4' }, { name: 'Node.js kur', uses: 'actions/setup-node@v4', with: { node-version: '20' } }, { name: 'Bagimliligi kur (firebase-admin)', run: 'npm install firebase-admin@12' }, { name: 'Hatirlatmalari kontrol et ve gonder', env: { FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }, run: 'node scripts/send-reminders.js' } ] } }
