name: Günlük Yevmiye Hatırlatması

on:
  schedule:
    # 14:00 UTC = 17:00 Türkiye saati
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılığı kur (firebase-admin)
        run: npm install firebase-admin@12

      - name: Hatırlatmaları kontrol et ve gönder
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-reminders.js
        
