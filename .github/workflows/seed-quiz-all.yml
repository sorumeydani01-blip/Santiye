name: Soru Havuzunu Yükle (Tek Seferlik)
on: { workflow_dispatch: {} }
jobs: { seed: { runs-on: ubuntu-latest, steps: [ { name: 'Kodu al', uses: 'actions/checkout@v4' }, { name: 'Node.js kur', uses: 'actions/setup-node@v4', with: { node-version: '20' } }, { name: 'Bagimliligi kur (firebase-admin)', run: 'npm install firebase-admin@12' }, { name: '1. Paket: seed-quiz-questions.js (66 soru)', env: { FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }, run: 'node scripts/seed-quiz-questions.js' }, { name: '2. Paket: seed-quiz-islami-100.js (99 soru)', env: { FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }, run: 'node scripts/seed-quiz-islami-100.js' }, { name: '3. Paket: seed-quiz-genel-batch2.js (35 soru)', env: { FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }, run: 'node scripts/seed-quiz-genel-batch2.js' }, { name: '4. Paket: seed-quiz-islami-5opt.js (100 soru)', env: { FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }, run: 'node scripts/seed-quiz-islami-5opt.js' }, { name: '5. Paket: seed-quiz-genel-batch3.js (50 soru)', env: { FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }, run: 'node scripts/seed-quiz-genel-batch3.js' }, { name: '6. Paket: seed-quiz-islami-batch2.js (48 soru)', env: { FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }, run: 'node scripts/seed-quiz-islami-batch2.js' } ] } }
