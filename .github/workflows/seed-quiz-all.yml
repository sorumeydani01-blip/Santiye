name: Soru Havuzunu Yükle (Tek Seferlik)

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bagimliligi kur (firebase-admin)
        run: npm install firebase-admin@12

      - name: 'Paket: seed-islami-batch-yeni.js'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/seed-islami-batch-yeni.js
        continue-on-error: true

      - name: 'Paket: seed-islami-cami-ibadet.js'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/seed-islami-cami-ibadet.js
        continue-on-error: true

