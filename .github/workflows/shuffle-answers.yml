name: Şıkları Karıştır (Tek Seferlik)

on:
  workflow_dispatch:

jobs:
  shuffle:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılığı kur (firebase-admin)
        run: npm install firebase-admin

      - name: Şıkları karıştır
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/shuffle-quiz-answers.js
